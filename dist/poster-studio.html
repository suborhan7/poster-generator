<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borhan Poster Studio</title>
<meta name="theme-color" content="#0B1426">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600&family=Hind+Siliguri:wght@500;700&display=swap">
<style>
/* Layout: a control rail on the left, the live poster on the right; stacks to one column on phones. */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --ink: #12151c;
  --muted: #5b6272;
  --line: #dfe2ea;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --chip: #eef0f5;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Hind Siliguri", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1015; --panel: #171a22; --ink: #eceef3; --muted: #9aa1b2; --line: #2a2f3b;
    --accent: #7aa2ff; --accent-ink: #0e1015; --chip: #222633; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1015; --panel: #171a22; --ink: #eceef3; --muted: #9aa1b2; --line: #2a2f3b;
  --accent: #7aa2ff; --accent-ink: #0e1015; --chip: #222633; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; padding-inline: 16px; padding-block: 16px 32px; }
* { box-sizing: border-box; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
header.top { max-width: 1240px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
header.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; margin: 0; text-transform: uppercase; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.label { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .types button {
  font: 600 14px var(--font-body); color: var(--ink); background: var(--chip); border: 1px solid transparent;
  border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.types button { border-radius: 8px; text-align: left; padding: 9px 11px; }
.seg button[aria-pressed="true"], .types button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select {
  font: 500 15px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 64px; }
.field input[type="range"] { padding: 0; accent-color: var(--accent); }
.field input[type="color"] { height: 38px; padding: 3px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 12px; align-items: center; min-width: 0; }
@media (max-width: 860px) { .stage { position: static; order: -1; } canvas#poster { max-height: 55vh; } }
canvas#poster { width: auto; max-width: 100%; max-height: 78vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.25); background: #000; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.primary { font: 700 16px var(--font-display); letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px 22px; cursor: pointer; }
.ghost { font: 600 14px var(--font-body); background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; cursor: pointer; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; text-align: center; }
#saveImg { max-width: min(100%, 360px); border-radius: 6px; }
details summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
details[open] summary { margin-bottom: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <h1>Borhan Poster Studio</h1>
  <p>Pick a card, type the details, add a photo, download or share.</p>
</header>

<div class="wrap">
  <div class="rail">
    <section class="box">
      <span class="label">Sport</span>
      <div class="seg" id="cats"></div>
      <span class="label">Card type</span>
      <div class="types" id="types"></div>
    </section>

    <section class="box">
      <span class="label">Details</span>
      <div class="fields" id="fields"></div>
      <p class="hint" id="tplHint"></p>
    </section>

    <section class="box">
      <span class="label">Photo</span>
      <div class="fields">
        <div class="field wide"><label for="photo1">Player photo (a cutout PNG looks best)</label><input id="photo1" type="file" accept="image/*"></div>
        <div class="field wide" id="photo2Wrap" hidden><label for="photo2" id="photo2Label">Second player photo</label><input id="photo2" type="file" accept="image/*"></div>
        <div class="field"><label for="zoom">Zoom</label><input id="zoom" type="range" min="0.6" max="2.5" step="0.01" value="1"></div>
        <div class="field"><label for="shade">Darken photo</label><input id="shade" type="range" min="0" max="0.8" step="0.01" value="0.15"></div>
        <div class="field"><label for="offx">Move left / right</label><input id="offx" type="range" min="-50" max="50" step="1" value="0"></div>
        <div class="field"><label for="offy">Move up / down</label><input id="offy" type="range" min="-50" max="50" step="1" value="0"></div>
        <div class="field wide"><button class="ghost" id="resetPhoto" type="button">Reset photo position</button></div>
      </div>
    </section>

    <section class="box">
      <details id="brandBox">
        <summary>Brand settings</summary>
        <div class="fields">
          <div class="field wide"><label for="b_theme">Colour theme</label><select id="b_theme"></select></div>
          <div class="field"><label for="b_handle">Handle</label><input id="b_handle" type="text"></div>
          <div class="field"><label for="b_name">Page name</label><input id="b_name" type="text"></div>
          <div class="field"><label for="b_accent">Accent colour</label><input id="b_accent" type="color"></div>
          <div class="field"><label for="b_bg">Background colour</label><input id="b_bg" type="color"></div>
          <div class="field wide"><label for="b_logo">Logo (optional, replaces the handle and the BR badge)</label><input id="b_logo" type="file" accept="image/*"></div>
          <div class="field wide"><button class="ghost" id="b_clearLogo" type="button">Remove logo</button></div>
        </div>
      </details>
    </section>
  </div>

  <div class="stage">
    <div class="seg" id="platforms" role="group" aria-label="Platform"></div>
    <canvas id="poster" width="1080" height="1350" aria-label="Poster preview"></canvas>
    <div class="actions">
      <button class="primary" id="download" type="button">Download PNG</button>
      <button class="ghost" id="share" type="button">Share to app</button>
      <button class="ghost" id="showImg" type="button">Show image to save</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <img id="saveImg" alt="Finished poster. Long-press or right-click to save." hidden>
  </div>
</div>

<script>
// Drawing toolkit shared by every layout. You rarely need to edit this file.
// layouts.js receives this kit as `k` and uses its helpers to draw cards.
window.BPG = window.BPG || {};

BPG.createKit = function (ctx, env) {
  const F = BPG.FONTS, D = F.display, C = F.condensed;
  const k = { ctx, D, C, B: F.body };

  k.font = (size, fam, weight) => `${weight || ""} ${size}px ${fam}`.trim();
  k.spaced = (px) => { try { ctx.letterSpacing = px + "px"; } catch (e) {} };

  // Shrink text until it fits maxW; returns the size used.
  k.fit = (text, maxW, size, fam, weight, min) => {
    let s = size;
    ctx.font = k.font(s, fam, weight);
    while (ctx.measureText(text).width > maxW && s > (min || 24)) { s -= 4; ctx.font = k.font(s, fam, weight); }
    return s;
  };

  k.hexA = (hex, a) => {
    const h = hex.replace("#", ""); const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };
  // Dark or white text, whichever reads on this colour.
  k.inkOn = (hex) => {
    const n = parseInt(hex.replace("#", ""), 16);
    const l = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
    return l > 150 ? "#0B0F18" : "#FFFFFF";
  };
  k.roundRect = (x, y, w, h, r) => {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };

  // Photo filling a box, using the zoom / move sliders.
  k.coverImg = (img, x, y, w, h, useSliders = true) => {
    const a = useSliders ? env.adjust() : { zoom: 1, offx: 0, offy: 0 };
    const s = Math.max(w / img.width, h / img.height) * a.zoom;
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, x + (w - dw) / 2 + (a.offx / 100) * w, y + (h - dh) / 2 + (a.offy / 100) * h, dw, dh);
  };
  k.circlePhoto = (img, cx, cy, r, ring) => {
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    const s = Math.max((2 * r) / img.width, (2 * r) / img.height);
    ctx.drawImage(img, cx - (img.width * s) / 2, cy - (img.height * s) / 2, img.width * s, img.height * s); ctx.restore();
    if (ring) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 10; ctx.strokeStyle = ring; ctx.stroke(); }
  };
  // Draws the main photo into the top `h` pixels, then darkens it by the slider plus `extraShade`.
  k.photoArea = (g, h, extraShade = 0) => {
    if (!g.photo) return false;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, g.W, h); ctx.clip();
    k.coverImg(g.photo.img, 0, 0, g.W, h); ctx.restore();
    const shade = env.adjust().shade + extraShade;
    if (shade > 0) { ctx.fillStyle = k.hexA(g.bg, Math.min(0.9, shade)); ctx.fillRect(0, 0, g.W, h); }
    return true;
  };
  k.photoHint = (g, y) => {
    ctx.font = k.font(34, C, 600); ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillText("Add a player photo", g.W / 2, y); ctx.textAlign = "left";
  };

  k.background = (g) => {
    const { W, H, bg, accent } = g;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const gr = ctx.createRadialGradient(W * 0.85, H * 0.15, 0, W * 0.85, H * 0.15, W * 0.9);
    gr.addColorStop(0, k.hexA(accent, 0.28)); gr.addColorStop(1, k.hexA(accent, 0));
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.045)"; ctx.lineWidth = 18;
    for (let i = -H; i < W + H; i += 64) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i - H * 0.6, H); ctx.stroke(); }
    ctx.restore();
  };
  // Fades the photo into the background colour from `from` to `to`, solid below.
  k.fadeBottom = (g, from, to) => {
    const gr = ctx.createLinearGradient(0, from, 0, to);
    gr.addColorStop(0, k.hexA(g.bg, 0)); gr.addColorStop(1, k.hexA(g.bg, 1));
    ctx.fillStyle = gr; ctx.fillRect(0, from, g.W, to - from); ctx.fillStyle = g.bg; ctx.fillRect(0, to, g.W, g.H - to);
  };
  // Darkens the photo towards the bottom so text can sit on top of it, without hiding the photo.
  k.scrim = (g, from, to) => {
    const gr = ctx.createLinearGradient(0, from, 0, to);
    gr.addColorStop(0, k.hexA(g.bg, 0)); gr.addColorStop(0.55, k.hexA(g.bg, 0.55)); gr.addColorStop(1, k.hexA(g.bg, 0.8));
    ctx.fillStyle = gr; ctx.fillRect(0, from, g.W, to - from);
    ctx.fillStyle = k.hexA(g.bg, 0.8); ctx.fillRect(0, to, g.W, g.H - to);
  };
  // The two diagonal accent lines that sit between photo and text.
  k.slash = (g, y) => {
    ctx.save(); ctx.strokeStyle = g.accent; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(0, y + 40); ctx.lineTo(g.W, y - 50); ctx.stroke();
    ctx.globalAlpha = 0.45; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, y + 62); ctx.lineTo(g.W, y - 28); ctx.stroke(); ctx.restore();
  };

  // Top row: match tag pill on the left, handle or logo on the right.
  k.header = (g) => {
    const { W, st: top, accent } = g, s = env.state(), logo = env.logo();
    const kick = (s.kicker || "").toUpperCase();
    if (kick) {
      ctx.font = k.font(36, C, 700); k.spaced(3);
      const w = Math.min(ctx.measureText(kick).width, W - 360);
      ctx.fillStyle = accent; k.roundRect(56, top + 18, w + 44, 58, 29); ctx.fill();
      ctx.fillStyle = k.inkOn(accent); ctx.textBaseline = "middle";
      ctx.fillText(kick, 78, top + 49, W - 360); k.spaced(0);
    }
    if (logo) {
      const sc = 96 / Math.max(logo.width, logo.height);
      ctx.drawImage(logo, W - 56 - logo.width * sc, top, logo.width * sc, logo.height * sc);
    } else {
      ctx.font = k.font(36, C, 700); ctx.fillStyle = "#FFFFFF"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(s.brand.handle || "", W - 56, top + 49); ctx.textAlign = "left";
    }
    ctx.textBaseline = "alphabetic";
  };
  // Bottom row: your verdict if you typed one, otherwise the page name.
  k.footer = (g) => {
    const { W, footerY: y, accent } = g, s = env.state();
    ctx.fillStyle = accent; ctx.fillRect(56, y - 22, 22, 22);
    const v = (s.verdict || "").trim();
    if (v) {
      ctx.font = k.font(30, C, 700); k.spaced(4); ctx.fillStyle = accent;
      const lab = BPG.BRAND.verdictLabel; ctx.fillText(lab, 92, y);
      const lw = ctx.measureText(lab).width; k.spaced(0);
      ctx.font = k.font(k.fit(v, W - 92 - lw - 90, 40, C, 700, 22), C, 700); ctx.fillStyle = "#FFFFFF";
      ctx.fillText(v, 92 + lw + 22, y + 2);
      return;
    }
    ctx.font = k.font(28, C, 700); k.spaced(5); ctx.fillStyle = "rgba(255,255,255,0.78)";
    ctx.fillText((s.brand.name || "").toUpperCase(), 92, y); k.spaced(0);
  };

  // ---- Text ----
  // Rich text: words wrapped in *stars* are drawn in the accent colour.
  k.richWords = (text) => {
    const out = []; let hl = false;
    String(text).split(/\s+/).filter(Boolean).forEach((w) => {
      const starts = w.startsWith("*"), ends = w.endsWith("*") && w.length > 1;
      if (starts) hl = true;
      out.push({ w: w.replace(/\*/g, ""), hl });
      if (ends || (starts && w.length > 1 && w.slice(1).includes("*"))) hl = false;
    });
    return out;
  };
  // Wraps rich text into at most maxLines, shrinking the font as needed.
  k.layoutRich = (text, maxW, size, fam, maxLines, min, weight) => {
    const words = k.richWords(text);
    for (let s = size; ; s -= 4) {
      ctx.font = k.font(s, fam, weight);
      const sp = ctx.measureText(" ").width, lines = [[]]; let cur = 0;
      words.forEach((wd) => {
        const ww = ctx.measureText(wd.w).width;
        if (cur && cur + sp + ww > maxW) { lines.push([]); cur = 0; }
        lines[lines.length - 1].push(wd); cur += (cur ? sp : 0) + ww;
      });
      if (lines.length <= maxLines || s <= (min || 30)) return { size: s, lines };
    }
  };
  k.drawRich = (lay, x, y, lineH, fam, base, hi, align, weight) => {
    ctx.font = k.font(lay.size, fam, weight); k.spaced(0);
    const prev = ctx.textAlign; ctx.textAlign = "left";
    const sp = ctx.measureText(" ").width;
    lay.lines.forEach((ln, i) => {
      const total = ln.reduce((a, wd, j) => a + ctx.measureText(wd.w).width + (j ? sp : 0), 0);
      let cx = align === "center" ? x - total / 2 : x;
      ln.forEach((wd) => { ctx.fillStyle = wd.hl ? hi : base; ctx.fillText(wd.w, cx, y + i * lineH); cx += ctx.measureText(wd.w).width + sp; });
    });
    ctx.textAlign = prev;
  };
  k.bigText = (g, text, y, size) => {
    const s = k.fit(text.toUpperCase(), g.W - 112, size || 170, D);
    ctx.font = k.font(s, D); ctx.fillStyle = g.accent; ctx.fillText(text.toUpperCase(), 52, y); return s;
  };
  k.nameText = (g, text, y, size) => {
    const s = k.fit(String(text).toUpperCase(), g.W - 112, size || 108, D);
    ctx.font = k.font(s, D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(text).toUpperCase(), 54, y);
  };
  k.subText = (g, text, y) => {
    ctx.font = k.font(44, C, 600); ctx.fillStyle = "rgba(255,255,255,0.82)"; ctx.fillText(text, 56, y, g.W - 112);
  };
  k.label = (text, x, y, color, size = 48) => {
    ctx.font = k.font(size, C, 700); k.spaced(4); ctx.fillStyle = color; ctx.fillText(String(text).toUpperCase(), x, y); k.spaced(0);
  };

  // A row of stat columns: [["Runs", "52"], ["Balls", "38"], ...]
  k.stats = (g, items, y, h = 116) => {
    const pad = 56, n = items.length; if (!n) return;
    const cw = (g.W - pad * 2) / n;
    items.forEach(([label, value], i) => {
      const x = pad + i * cw;
      if (i) { ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(x, y + 14, 2, h - 28); }
      ctx.textAlign = "center";
      ctx.font = k.font(k.fit(String(value), cw - 24, 76, D), D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(value), x + cw / 2, y + h * 0.58);
      ctx.font = k.font(26, C, 700); k.spaced(3); ctx.fillStyle = g.accent;
      ctx.fillText(String(label).toUpperCase(), x + cw / 2, y + h * 0.9, cw - 16); k.spaced(0);
      ctx.textAlign = "left";
    });
  };
  // A rotated outlined stamp, like "GONE!" or "DUCK".
  k.stamp = (text, cx, cy, size, color, angle = -0.16) => {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
    ctx.font = k.font(size, D); const tw = ctx.measureText(text).width;
    ctx.lineWidth = Math.max(6, size / 18); ctx.strokeStyle = color; k.roundRect(-tw / 2 - size * 0.18, -size * 0.92, tw + size * 0.36, size * 1.12, 16); ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(text, 0, 0); ctx.restore();
  };

  // ---- Cricket maths ----
  k.oversToBalls = (o) => { const [a, b] = String(o).split("."); return (parseInt(a) || 0) * 6 + (parseInt(b) || 0); };
  k.parseOver = (s) => {
    const balls = String(s).trim().split(/\s+/).filter(Boolean);
    let runs = 0, wk = 0;
    balls.forEach((b) => {
      const t = b.toLowerCase();
      if (t === "w") wk++;
      else if (t === "wd" || t === "nb") runs += 1;
      else if (/^(wd|nb)\d+$/.test(t)) runs += 1 + parseInt(t.slice(2));
      else if (!isNaN(parseInt(t))) runs += parseInt(t);
    });
    return { balls, runs, wk };
  };
  k.overBalls = (g, balls, y) => {
    const { W, accent } = g;
    const n = Math.max(balls.length, 6), gap = 16, d = Math.min(130, (W - 112 - gap * (n - 1)) / n);
    balls.forEach((b, i) => {
      const cx = 56 + d / 2 + i * (d + gap), cy = y + d / 2, t = b.toUpperCase();
      ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
      let fill = "rgba(255,255,255,0.10)", ink = "#FFFFFF", stroke = null;
      if (t === "W" || t === "6") { fill = accent; ink = k.inkOn(accent); }
      else if (t === "4") { fill = "rgba(255,255,255,0)"; stroke = accent; }
      ctx.fillStyle = fill; ctx.fill();
      if (stroke) { ctx.lineWidth = 6; ctx.strokeStyle = stroke; ctx.stroke(); }
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const label = t === "0" ? "•" : t;
      ctx.font = k.font(k.fit(label, d - 22, d * 0.5, D), D); ctx.fillStyle = ink; ctx.fillText(label, cx, cy + 3);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    });
  };

  return k;
};

</script>
<script>
// Card designs. Each layout is one entry in BPG.LAYOUTS.
//
//   standard: true  → the app draws the background, photo (top part), fade, top row and bottom row for you,
//                     and your draw(k, g) only adds the middle text.
//   standard: false → draw(k, g) draws everything after the background (full control).
//   giant(g)        → optional: big number drawn behind a cutout player (standard layouts only).
//
// `k` is the toolkit from engine.js, `g` is everything about the current card:
//   g.W, g.H                size of the poster
//   g.st, g.sb              top and bottom of the safe zone
//   g.blockTop, g.bigBase, g.nameBase, g.subBase, g.statsTop, g.footerY   standard text rows (y positions)
//   g.accent, g.bg          colours
//   g.val("id")             what the user typed in a field
//   g.big                   the big headline word
//   g.t                     the card definition from templates.js
//   g.photo, g.photos[2]    uploaded photos ({ img, cut }) or null
// Cricket designs live in cricket.js.
window.BPG = window.BPG || {};

BPG.LAYOUTS = {

  status: {
    standard: true,
    draw(k, g) {
      const ctx = k.ctx, top = g.blockTop + 20;
      if (g.val("player")) { ctx.font = k.font(60, k.C, 700); k.spaced(3); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(g.val("player")).toUpperCase(), 56, top + 50, g.W - 112); k.spaced(0); }
      const stTop = top + 80, txt = String(g.val("stamp")).toUpperCase();
      let lay = k.layoutRich(txt, g.W - 112, 200, k.D, 2, 60);
      while (lay.lines.length * lay.size > g.footerY - 120 - stTop && lay.size > 60) lay = k.layoutRich(txt, g.W - 112, lay.size - 6, k.D, 2, 60);
      k.drawRich(lay, 52, stTop + lay.size * 0.88, lay.size, k.D, "#FFFFFF", g.accent, "left");
      if (g.val("detail")) {
        ctx.font = k.font(44, k.C, 600); ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.fillText(String(g.val("detail")).toUpperCase(), 56, Math.min(g.footerY - 62, stTop + lay.lines.length * lay.size + 46), g.W - 112);
      }
      if (g.t.coin) {
        const cx = g.W - 190, cy = g.blockTop - 90, r = 110;
        const gr = ctx.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, r);
        gr.addColorStop(0, "#FFE9A3"); gr.addColorStop(1, "#C9962B");
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, r - 16, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(120,80,10,0.6)"; ctx.stroke();
        ctx.textAlign = "center"; ctx.font = k.font(64, k.D); ctx.fillStyle = "#6B4A0E"; ctx.fillText("TOSS", cx, cy + 24); ctx.textAlign = "left";
      }
    },
  },

  goal: {
    standard: true,
    draw(k, g) {
      const ctx = k.ctx, big = g.big.toUpperCase();
      const s = k.bigText(g, big, g.bigBase, 220);
      ctx.font = k.font(s, k.D); const gw = ctx.measureText(big).width;
      ctx.font = k.font(64, k.D); const mw = ctx.measureText(g.val("minute")).width;
      if (52 + gw + 40 + mw + 40 < g.W - 56) {
        ctx.fillStyle = "#FFFFFF"; k.roundRect(52 + gw + 30, g.bigBase - 92, mw + 40, 88, 12); ctx.fill();
        ctx.fillStyle = "#0B0F18"; ctx.fillText(g.val("minute"), 52 + gw + 50, g.bigBase - 22);
      }
      k.nameText(g, g.val("player"), g.nameBase);
      k.subText(g, `${g.val("team")} vs ${g.val("opp")}`, g.subBase);
      k.stats(g, [["Score", String(g.val("score")).replace(/^[^\d]*?(\d+\s*-\s*\d+).*$/, "$1")], ["Minute", g.val("minute")], ["Assist", String(g.val("assist")).split(" ").slice(-1)[0] || "-"]], g.statsTop);
    },
  },

  fscore: {
    standard: true,
    draw(k, g) {
      const ctx = k.ctx;
      if (g.val("headline")) {
        const lay = k.layoutRich(String(g.val("headline")).toUpperCase(), g.W - 112, 110, k.D, 2, 50);
        k.drawRich(lay, 52, g.blockTop + 100 - (lay.lines.length - 1) * lay.size, lay.size, k.D, "#FFFFFF", g.accent, "left");
      }
      const nb = g.statsTop + 10, xs = [g.W * 0.27, g.W * 0.73];
      ctx.textAlign = "center";
      [[g.val("s1"), g.val("t1")], [g.val("s2"), g.val("t2")]].forEach(([n, tm], i) => {
        ctx.font = k.font(k.fit(String(n), g.W * 0.4, 330, k.D), k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(n), xs[i], nb);
        ctx.font = k.font(k.fit(String(tm).toUpperCase(), g.W * 0.42, 58, k.D), k.D); ctx.fillText(String(tm).toUpperCase(), xs[i], nb + 72);
      });
      ctx.fillStyle = g.accent; k.roundRect(g.W / 2 - 50, nb - 190, 100, 64, 32); ctx.fill();
      ctx.font = k.font(40, k.D); ctx.fillStyle = k.inkOn(g.accent); ctx.fillText("FT", g.W / 2, nb - 141);
      ctx.font = k.font(32, k.C, 600); ctx.fillStyle = "rgba(255,255,255,0.78)"; ctx.fillText(g.val("potm"), g.W / 2, nb + 118, g.W - 112);
      ctx.textAlign = "left";
    },
  },

  redcard: {
    standard: true,
    draw(k, g) {
      const ctx = k.ctx, big = g.big.toUpperCase();
      const s = k.bigText(g, big, g.bigBase, 200);
      ctx.font = k.font(s, k.D); const gw = ctx.measureText(big).width;
      if (52 + gw + 120 < g.W - 56) {
        ctx.save(); ctx.translate(52 + gw + 80, g.bigBase - s * 0.42); ctx.rotate(0.18);
        ctx.fillStyle = g.accent; k.roundRect(-38, -s * 0.42, 76, s * 0.84, 8); ctx.fill(); ctx.restore();
      }
      k.nameText(g, g.val("player"), g.nameBase);
      k.subText(g, `${g.val("team")} vs ${g.val("opp")} · ${g.val("reason")}`, g.subBase);
      k.stats(g, [["Minute", g.val("minute")], ["Team", g.val("team")]], g.statsTop);
    },
  },

  rating: {
    standard: true,
    giant: (g) => g.val("rating"),
    draw(k, g) {
      k.bigText(g, g.val("rating") + "/10", g.bigBase, 200);
      k.nameText(g, g.val("player"), g.nameBase);
      k.subText(g, `${g.val("team")} vs ${g.val("opp")} · player rating`, g.subBase);
      const items = String(g.val("stats")).split(",").map((x) => x.split(":").map((y) => y.trim())).filter((x) => x[0]).slice(0, 4).map(([a, b]) => [a, b || ""]);
      k.stats(g, items, g.statsTop);
    },
  },

  breaking: {
    standard: true,
    draw(k, g) {
      const ctx = k.ctx;
      ctx.fillStyle = g.accent; ctx.fillRect(56, g.bigBase - 110, 420, 96);
      ctx.font = k.font(78, k.D); ctx.fillStyle = k.inkOn(g.accent); ctx.fillText(g.big.toUpperCase(), 80, g.bigBase - 30, 380);
      const room = g.footerY - 150 - (g.bigBase + 30), hd = String(g.val("headline")).toUpperCase();
      let r = k.layoutRich(hd, g.W - 112, 104, k.D, 3, 50);
      while (r.lines.length * r.size > room && r.size > 50) r = k.layoutRich(hd, g.W - 112, r.size - 4, k.D, 3, 50);
      k.drawRich(r, 54, g.bigBase + 30 + r.size, r.size, k.D, "#FFFFFF", g.accent, "left");
      ctx.font = k.font(44, k.C, 600); ctx.fillStyle = "rgba(255,255,255,0.82)";
      ctx.fillText(g.val("detail"), 56, g.bigBase + 30 + r.lines.length * r.size + 66, g.W - 112);
    },
  },

  // ---------- Full-control layouts ----------

  hottake: {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx;
      k.photoArea(g, g.H, 0.45);
      k.header(g);
      const top = g.st + 140;
      ctx.font = k.font(300, k.D); ctx.fillStyle = g.accent; ctx.fillText("“", 40, top + 220);
      k.label(g.big, 210, top + 70, g.accent, 42);
      const avail = g.sb - 200 - (top + 260);
      const lay = k.layoutRich(String(g.val("quote")).toUpperCase(), g.W - 112, 120, k.D, Math.max(3, Math.floor(avail / 90)), 48);
      k.drawRich(lay, 54, top + 260 + lay.size * 0.8, lay.size * 1.05, k.D, "#FFFFFF", g.accent, "left");
      ctx.font = k.font(48, k.C, 700); ctx.fillStyle = g.accent;
      ctx.fillText("— " + g.val("by"), 56, top + 260 + lay.lines.length * lay.size * 1.05 + lay.size * 0.8 + 50);
      k.footer(g);
    },
  },

  quote: {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, W = g.W;
      const q = k.layoutRich(g.val("quote"), W - 160, 50, k.B, 7, 32, 500);
      const panelTop = g.footerY - 80 - q.lines.length * q.size * 1.28 - 300;
      if (!k.photoArea(g, g.H)) k.photoHint(g, (g.st + panelTop) / 2);
      else k.scrim(g, panelTop - 200, panelTop + 160);
      k.slash(g, panelTop + 10);
      k.header(g);
      if (g.photos[2]) k.circlePhoto(g.photos[2].img, 56 + 150, panelTop - 120, 150, g.accent);
      const nm = String(g.val("name")).toUpperCase();
      ctx.textAlign = "center";
      ctx.font = k.font(k.fit(nm, W - 112, 120, k.D), k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(nm, W / 2, panelTop + 150);
      const dy = panelTop + 215;
      ctx.fillStyle = k.hexA("#FFFFFF", 0.5); ctx.fillRect(110, dy - 4, W / 2 - 200, 3); ctx.fillRect(W / 2 + 90, dy - 4, W / 2 - 200, 3);
      ctx.font = k.font(110, k.D); ctx.fillStyle = g.accent; ctx.fillText("“ ”", W / 2, dy + 52);
      k.drawRich(q, W / 2, panelTop + 300, q.size * 1.28, k.B, "#FFFFFF", g.accent, "center", 500);
      if (g.val("context")) {
        ctx.font = k.font(32, k.C, 700); k.spaced(4); ctx.fillStyle = k.hexA("#FFFFFF", 0.6);
        ctx.fillText(String(g.val("context")).toUpperCase(), W / 2, panelTop + 300 + q.lines.length * q.size * 1.28 + 20); k.spaced(0);
      }
      ctx.textAlign = "left";
      k.footer(g);
    },
  },

  toplist: {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, W = g.W;
      k.photoArea(g, g.H, 0.55);
      k.header(g);
      const tl = k.layoutRich(String(g.val("title")).toUpperCase(), W - 112, 110, k.D, 3, 50);
      k.drawRich(tl, 54, g.st + 230, tl.size * 1.02, k.D, "#FFFFFF", g.accent, "left");
      const rows = String(g.val("items")).split("\n").map((r) => r.split("|").map((x) => x.trim())).filter((r) => r[0]).slice(0, 5);
      const top = g.st + 230 + tl.lines.length * tl.size * 1.02 + 30, avail = g.footerY - 70 - top;
      const rh = Math.min(230, avail / Math.max(rows.length, 1));
      rows.forEach(([v, n], i) => {
        const y = top + i * rh;
        ctx.fillStyle = "rgba(255,255,255,0.07)"; ctx.fillRect(56, y + 10, W - 112, rh - 20);
        ctx.fillStyle = g.accent; ctx.fillRect(56, y + 10, 12, rh - 20);
        ctx.font = k.font(rh * 0.5, k.D); ctx.fillStyle = k.hexA(g.accent, 0.9); ctx.fillText(String(i + 1), 100, y + rh * 0.68);
        ctx.font = k.font(k.fit(String(v), W * 0.42, rh * 0.5, k.D), k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(v), 100 + rh * 0.42, y + rh * 0.68);
        const nm = String(n || "").toUpperCase();
        ctx.font = k.font(k.fit(nm, W * 0.36, 52, k.C, 700), k.C, 700); ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.textAlign = "right"; ctx.fillText(nm, W - 92, y + rh * 0.64); ctx.textAlign = "left";
      });
      k.footer(g);
    },
  },

  versus: {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, { W, H, st, sb, accent, bg } = g, half = W / 2, ph = sb - 330;
      [1, 2].forEach((n) => {
        const x = n === 1 ? 0 : half, p = n === 1 ? g.photo : g.photos[2];
        ctx.save(); ctx.beginPath(); ctx.rect(x, 0, half, ph); ctx.clip();
        if (p) { k.coverImg(p.img, x, 0, half, ph); ctx.fillStyle = k.hexA(bg, g.shade); ctx.fillRect(x, 0, half, ph); }
        else { ctx.font = k.font(30, k.C, 600); ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillText(`Add photo ${n}`, x + half / 2, ph / 2); ctx.textAlign = "left"; }
        ctx.restore();
      });

      ctx.fillStyle = accent; ctx.fillRect(half - 4, st + 110, 8, ph - st - 200);
      ctx.beginPath(); ctx.arc(half, ph - 330, 92, 0, Math.PI * 2); ctx.fill();
      ctx.font = k.font(96, k.D); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = k.inkOn(accent); ctx.fillText("VS", half, ph - 324);
      ctx.textBaseline = "alphabetic";
      [[g.val("p1"), half / 2], [g.val("p2"), half + half / 2]].forEach(([nm, cx]) => {
        const t = String(nm).toUpperCase();
        ctx.font = k.font(k.fit(t, half - 80, 110, k.D), k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(t, cx, ph - 110);
      });
      ctx.textAlign = "left";
      k.header(g);
      const q = String(g.val("question")).toUpperCase();
      ctx.font = k.font(k.fit(q, W - 112, 130, k.D), k.D); ctx.fillStyle = accent; ctx.textAlign = "center"; ctx.fillText(q, half, g.footerY - 90); ctx.textAlign = "left";
      k.footer(g);
      void H;
    },
  },

  frame: {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, hl = g.val("headline");
      if (!k.photoArea(g, g.H)) k.photoHint(g, g.H / 2);
      if (hl) k.fadeBottom(g, g.H * 0.55, g.sb - 120);
      ctx.lineWidth = 10; ctx.strokeStyle = g.accent; ctx.strokeRect(28, 28, g.W - 56, g.H - 56);
      k.header(g);
      if (hl) {
        const lay = k.layoutRich(String(hl).toUpperCase(), g.W - 112, 130, k.D, 2, 60);
        k.drawRich(lay, 54, g.footerY - 60 - (lay.lines.length - 1) * lay.size * 1.02, lay.size * 1.02, k.D, "#FFFFFF", g.accent, "left");
      }

    },
  },

  // Your own "Match reaction" style: brand bar, score pill, big take, rant meter.
  reaction: {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, { W, H, st, sb, accent, bg } = g, s = BPG.state();
      const cream = "#F2EFE8", muted = "#C4C7CE", panel = "#1B1D23";

      // The photo fills the card; the text sits over its lower part, so it is laid out first from the bottom up.
      const barTop = H > 1500 ? st - 30 : 0, barH = 128;
      const meterY = H > 1500 ? sb - 30 : H - 70;
      const body = g.val("body") ? k.layoutRich(g.val("body"), W - 112, 34, k.B, 3, 26, 500) : null;
      const stats = String(g.val("stats")).split(",").map((x) => x.split(":").map((y) => y.trim())).filter((x) => x[0] && x[1]).slice(0, 4);
      const statH = 118, maxText = (meterY - barTop) * 0.46;
      let hl, textH;
      for (let size = 104; ; size -= 6) {
        hl = k.layoutRich(String(g.val("headline")).toUpperCase(), W - 112, size, k.D, 3, 54);
        textH = hl.lines.length * hl.size * 0.98 + (body ? 16 + body.lines.length * body.size * 1.4 : 0) + (stats.length ? 30 + statH : 0);
        if (textH <= maxText || size <= 60) break;
      }
      const textTop = meterY - 64 - textH, ph = 104, pillTop = textTop - 30 - ph;
      const photoBottom = textTop;

      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      if (g.photo) {
        k.coverImg(g.photo.img, 0, 0, W, H);
        if (g.shade > 0) { ctx.fillStyle = k.hexA(bg, g.shade); ctx.fillRect(0, 0, W, H); }
        k.scrim(g, pillTop - 260, textTop + 140);
      } else {
        ctx.fillStyle = panel; ctx.fillRect(0, barTop + barH, W, pillTop - barTop - barH);
        k.photoHint(g, (barTop + barH + pillTop) / 2);
      }
      const topShade = ctx.createLinearGradient(0, 0, 0, barTop + barH + 120);
      topShade.addColorStop(0, k.hexA(bg, 0.85)); topShade.addColorStop(1, k.hexA(bg, 0));
      ctx.fillStyle = topShade; ctx.fillRect(0, 0, W, barTop + barH + 120);
      const barBottom = barTop + barH;
      ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 16;

      // Brand bar
      const logo = BPG.logoImage();
      let x = 58; const cy = barTop + barH / 2;
      if (logo) { const sc = 76 / Math.max(logo.width, logo.height); ctx.drawImage(logo, x, cy - (logo.height * sc) / 2, logo.width * sc, logo.height * sc); x += logo.width * sc + 22; }
      else {
        ctx.save(); ctx.translate(x + 38, cy - 4); ctx.rotate(-0.08);
        ctx.fillStyle = accent; k.roundRect(-38, -30, 76, 60, 10); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-18, 26); ctx.lineTo(-30, 46); ctx.lineTo(0, 28); ctx.fill();
        ctx.font = k.font(40, k.D); ctx.fillStyle = "#14151A"; ctx.textAlign = "center"; ctx.fillText("BR", 0, 15);
        ctx.strokeStyle = accent; ctx.lineWidth = 4; ctx.lineCap = "round";
        [[44, -30, 54, -42], [48, -18, 62, -20]].forEach(([a, b, c, d]) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); });
        ctx.restore(); ctx.textAlign = "left"; x += 112;
      }
      const words = String(s.brand.name || "").toUpperCase().split(/\s+/);
      ctx.font = k.font(46, k.D); ctx.fillStyle = cream; ctx.fillText(words[0] || "", x, cy + 17); x += ctx.measureText((words[0] || "") + " ").width;
      ctx.fillStyle = accent; ctx.fillText(words[1] || "", x, cy + 17); x += ctx.measureText((words[1] || "") + " ").width;
      ctx.font = k.font(30, k.C, 600); k.spaced(6); ctx.fillStyle = muted; ctx.fillText(words.slice(2).join(" "), x + 4, cy + 15, W - x - 360); k.spaced(0);

      // Tag (slanted)
      const tag = String(g.val("tag")).toUpperCase();
      if (tag) {
        ctx.font = k.font(36, k.C, "italic 700"); k.spaced(5);
        const tw = ctx.measureText(tag).width + 70, tx = W - 58 - tw, ty = cy - 30;
        ctx.fillStyle = accent; ctx.beginPath(); ctx.moveTo(tx + 10, ty); ctx.lineTo(tx + tw, ty); ctx.lineTo(tx + tw - 10, ty + 60); ctx.lineTo(tx, ty + 60); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#14151A"; ctx.fillText(tag, tx + 34, ty + 43); k.spaced(0);
      }

      // Photo credit
      if (g.val("credit")) {
        ctx.font = k.font(24, k.B, 500); const cw = ctx.measureText("Photo: " + g.val("credit")).width + 28;
        ctx.fillStyle = "rgba(10,10,12,0.85)"; ctx.fillRect(W - 40 - cw, barBottom + 20, cw, 44);
        ctx.fillStyle = "#FFFFFF"; ctx.fillText("Photo: " + g.val("credit"), W - 40 - cw + 14, barBottom + 50);
      }

      // Score pill
      if (g.val("score")) {
        const py = pillTop, team = String(g.val("team")).toUpperCase(), score = String(g.val("score"));
        ctx.save(); ctx.transform(1, 0, -0.12, 1, 0, 0);
        ctx.font = k.font(76, k.D); const w1 = ctx.measureText(team + " ").width, w2 = ctx.measureText(score).width;
        const bw = w1 + w2 + 70, px = 62 + py * 0.12;
        ctx.fillStyle = "#0E0F12"; ctx.fillRect(px, py, bw, ph);
        ctx.fillStyle = cream; ctx.fillText(team, px + 36, py + 82);
        ctx.fillStyle = accent; ctx.fillText(score, px + 36 + w1, py + 82);
        const l1 = String(g.val("line1")).toUpperCase(), l2 = String(g.val("line2")).toUpperCase();
        if (l1 || l2) {
          ctx.font = k.font(32, k.C, "italic 700"); k.spaced(4);
          const lw = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) + 60;
          ctx.fillStyle = accent; ctx.fillRect(px + bw, py, lw, ph);
          ctx.fillStyle = "#14151A"; ctx.fillText(l1, px + bw + 30, py + 45); ctx.fillText(l2, px + bw + 30, py + 84); k.spaced(0);
        }
        ctx.restore();
      }

      // Headline, body, stats
      let y = photoBottom + hl.size * 0.8;
      k.drawRich(hl, 54, y, hl.size * 0.98, k.D, cream, accent, "left");
      y += (hl.lines.length - 1) * hl.size * 0.98;
      if (body) { y += 16 + body.size * 1.25; k.drawRich(body, 56, y, body.size * 1.4, k.B, "#E4E6EB", accent, "left", 500); y += (body.lines.length - 1) * body.size * 1.4; }
      if (stats.length) {
        const top = y + 30, gap = 22, bw = (W - 112 - gap * (stats.length - 1)) / stats.length;
        stats.forEach(([lab, v], i) => {
          const bx = 56 + i * (bw + gap);
          ctx.fillStyle = k.hexA(panel, 0.72); ctx.fillRect(bx, top, bw, statH);
          ctx.textAlign = "center";
          ctx.font = k.font(k.fit(v, bw - 30, 72, k.D), k.D); ctx.fillStyle = accent; ctx.fillText(v, bx + bw / 2, top + 74);
          ctx.font = k.font(26, k.C, 700); k.spaced(4); ctx.fillStyle = muted; ctx.fillText(lab.toUpperCase(), bx + bw / 2, top + 106, bw - 20); k.spaced(0);
          ctx.textAlign = "left";
        });
      }

      // Rant meter + handle
      ctx.font = k.font(34, k.C, 700); k.spaced(6); ctx.fillStyle = muted; ctx.fillText("RANT METER", 56, meterY); k.spaced(0);
      const lvl = Math.max(0, Math.min(5, parseInt(g.val("rant")) || 0));
      for (let i = 0; i < 5; i++) {
        const bh = 20 + i * 14, bx = 300 + i * 46;
        ctx.save(); ctx.transform(1, 0, -0.18, 1, 0, 0);
        ctx.fillStyle = i < lvl ? accent : "#3A3D45"; ctx.fillRect(bx + meterY * 0.18, meterY + 8 - bh, 34, bh); ctx.restore();
      }
      ctx.font = k.font(36, k.C, 700); k.spaced(2); ctx.fillStyle = cream; ctx.textAlign = "right";
      ctx.fillText(s.verdict ? s.verdict : s.brand.handle || "", W - 56, meterY, W - 600); ctx.textAlign = "left"; k.spaced(0);
      ctx.restore();
    },
  },
};

<script>
// Cricket card designs: fifty, century, knock, wicket, five-for, overs, score update, innings break, result, form, toss.
// Each card draws its whole poster (standard: false) so every one can have its own shape.
// The text is laid out from the bottom up, and the photo takes whatever space is left above it,
// so the same design works for Instagram (1080 x 1350) and TikTok (1080 x 1920).
window.BPG = window.BPG || {};

(function () {
  const L = BPG.LAYOUTS, PAD = 56;
  const cap = (s) => String(s == null ? "" : s).toUpperCase();
  const num = (s) => parseInt(String(s).replace(/[^\d-]/g, ""), 10) || 0;

  // ---------- Shared pieces ----------

  // Photo over the top of the card, fading into the background between fadeFrom and fadeTo.
  // grey: 0 to 1 takes the colour out (used for wickets and ducks).
  function photo(k, g, fadeFrom, fadeTo, grey) {
    const ctx = k.ctx, { W, bg } = g;
    if (g.photo) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, g.H); ctx.clip();
      k.coverImg(g.photo.img, 0, 0, W, g.H);
      if (grey) {
        ctx.globalCompositeOperation = "saturation"; ctx.globalAlpha = grey; ctx.fillStyle = "#808080"; ctx.fillRect(0, 0, W, g.H);
        ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = 0.35; ctx.fillStyle = g.accent; ctx.fillRect(0, 0, W, g.H);
      }
      ctx.restore();
      if (g.shade > 0) { ctx.fillStyle = k.hexA(bg, Math.min(0.9, g.shade)); ctx.fillRect(0, 0, W, g.H); }
    } else k.photoHint(g, g.st + (fadeFrom - g.st) / 2 + 60);
    const top = ctx.createLinearGradient(0, 0, 0, g.st + 200);
    top.addColorStop(0, k.hexA(bg, 0.7)); top.addColorStop(1, k.hexA(bg, 0));
    ctx.fillStyle = top; ctx.fillRect(0, 0, W, g.st + 200);
    if (g.photo) k.scrim(g, fadeFrom, fadeTo + 160);
  }

  // Slanted colour band with a big word, plus an optional small line after it.
  function ribbon(k, g, text, top, h, sub) {
    const ctx = k.ctx, t = cap(text), s = cap(sub), sl = h * 0.3, ink = k.inkOn(g.accent);
    ctx.font = k.font(30, k.C, 700); k.spaced(3);
    const sw = s ? Math.min(ctx.measureText(s).width, g.W * 0.42) + 34 : 0; k.spaced(0);
    const size = k.fit(t, g.W - 2 * PAD - 70 - sw, Math.round(h * 0.8), k.D, "", 40);
    ctx.font = k.font(size, k.D); k.spaced(1);
    const tw = ctx.measureText(t).width, w = tw + 60 + sw, x = PAD - 8;
    ctx.fillStyle = g.accent; ctx.beginPath();
    ctx.moveTo(x + sl, top); ctx.lineTo(x + w + sl, top); ctx.lineTo(x + w, top + h); ctx.lineTo(x, top + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = ink; ctx.fillText(t, x + 28, top + h / 2 + size * 0.37); k.spaced(0);
    if (s) {
      ctx.globalAlpha = 0.72; ctx.fillRect(x + 28 + tw + 16, top + h * 0.28, 3, h * 0.44);
      ctx.font = k.font(30, k.C, 700); k.spaced(3);
      ctx.fillText(s, x + 28 + tw + 34, top + h / 2 + 11, g.W * 0.42); k.spaced(0); ctx.globalAlpha = 1;
    }
  }

  // First names small, surname big: "NAJMUL HOSSAIN" over "SHANTO". Returns the top of the block.
  function playerName(k, g, full, base, max, draw) {
    const ctx = k.ctx, parts = cap(full).trim().split(/\s+/), last = parts.pop() || "", first = parts.join(" ");
    const size = k.fit(last, g.W - 2 * PAD, max || 150, k.D, "", 60);
    let top = base - size * 0.76;
    if (draw !== false) { ctx.font = k.font(size, k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(last, PAD - 4, base); }
    if (first) {
      if (draw !== false) {
        ctx.font = k.font(44, k.C, 700); k.spaced(6); ctx.fillStyle = "rgba(255,255,255,0.82)";
        ctx.fillText(first, PAD, top - 18, g.W - 2 * PAD); k.spaced(0);
      }
      top -= 18 + 36;
    }
    return top;
  }

  // Rounded label chip. Returns its width.
  function chip(k, g, text, x, top, filled, align) {
    const ctx = k.ctx, t = cap(text);
    ctx.font = k.font(32, k.C, 700); k.spaced(3);
    const w = ctx.measureText(t).width + 44, left = align === "right" ? x - w : x;
    k.roundRect(left, top, w, 58, 29);
    if (filled) { ctx.fillStyle = g.accent; ctx.fill(); ctx.fillStyle = k.inkOn(g.accent); }
    else { ctx.lineWidth = 3; ctx.strokeStyle = k.hexA(g.accent, 0.9); ctx.stroke(); ctx.fillStyle = "#FFFFFF"; }
    ctx.fillText(t, left + 22, top + 40); k.spaced(0);
    return w;
  }

  // How the runs came: one bar split into sixes, fours and running between the wickets.
  function runsBar(k, g, y, runs, fours, sixes, extra) {
    const ctx = k.ctx, w = g.W - 2 * PAD, f = fours * 4, s6 = sixes * 6, run = Math.max(0, runs - f - s6), tot = Math.max(runs, f + s6, 1);
    const segs = [[s6, g.accent, `${s6} in sixes`], [f, k.hexA(g.accent, 0.5), `${f} in fours`], [run, "rgba(255,255,255,0.3)", `${run} running`]];
    ctx.font = k.font(28, k.C, 700); k.spaced(2);
    let x = PAD;
    segs.forEach(([, c, lab]) => {
      ctx.fillStyle = c; ctx.fillRect(x, y - 38, 18, 18);
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillText(cap(lab), x + 28, y - 20); x += ctx.measureText(cap(lab)).width + 58;
    });
    if (extra) { ctx.textAlign = "right"; ctx.fillStyle = g.accent; ctx.fillText(cap(extra), g.W - PAD, y - 20); ctx.textAlign = "left"; }
    k.spaced(0);
    ctx.save(); k.roundRect(PAD, y, w, 24, 12); ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(PAD, y, w, 24);
    x = PAD;
    segs.forEach(([v, c]) => { const sw = (w * v) / tot; ctx.fillStyle = c; ctx.fillRect(x, y, sw, 24); x += sw; });
    ctx.restore();
  }

  // A cricket ball with its stitched seam. o: { white, alpha, label, ring }
  function ball(k, cx, cy, r, o) {
    o = o || {};
    const ctx = k.ctx, c = o.white ? ["#FFFFFF", "#AEB3BD", "#C8202E"] : ["#E5414B", "#5E0911", "#F6E7D2"];
    ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
    if (o.ring) { ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, Math.PI * 2); ctx.lineWidth = 7; ctx.strokeStyle = o.ring; ctx.stroke(); }
    const gr = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.08, cx, cy, r);
    gr.addColorStop(0, c[0]); gr.addColorStop(1, c[1]);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill(); ctx.clip();
    const R = r * 2.4, span = Math.asin(1 / 2.4) + 0.05;
    ctx.strokeStyle = c[2]; ctx.lineWidth = Math.max(1.5, r * 0.04);
    [-0.1, 0.1].forEach((d) => { ctx.beginPath(); ctx.arc(cx + R + d * r, cy, R, Math.PI - span, Math.PI + span); ctx.stroke(); });
    for (let a = -span; a <= span; a += span / 6) {
      const ax = cx + R - R * Math.cos(a), ay = cy - R * Math.sin(a);
      ctx.beginPath(); ctx.moveTo(ax - r * 0.17, ay); ctx.lineTo(ax + r * 0.17, ay); ctx.stroke();
    }
    ctx.restore();
    if (o.label) {
      const t = String(o.label);
      ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = k.font(Math.round(r * (t.length > 1 ? 0.78 : 1.02)), k.D);
      ctx.lineJoin = "round"; ctx.lineWidth = r * 0.16; ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.strokeText(t, cx, cy + r * 0.05);
      ctx.fillStyle = "#FFFFFF"; ctx.fillText(t, cx, cy + r * 0.05); ctx.restore();
    }
  }

  // Sun rays behind a century.
  function rays(k, cx, cy, R, n, color, alpha) {
    const ctx = k.ctx; ctx.save(); ctx.fillStyle = k.hexA(color, alpha);
    for (let i = 0; i < n; i++) {
      const a0 = (i * 2 * Math.PI) / n, a1 = a0 + Math.PI / n;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a0), cy + R * Math.sin(a0)); ctx.lineTo(cx + R * Math.cos(a1), cy + R * Math.sin(a1)); ctx.fill();
    }
    ctx.restore();
  }

  // Printed-dot texture that grows towards the bottom right.
  function halftone(k, x, y, w, h, color, alpha) {
    const ctx = k.ctx, step = 22; ctx.save(); ctx.fillStyle = k.hexA(color, alpha);
    for (let py = y; py < y + h; py += step) for (let px = x; px < x + w; px += step) {
      const t = ((px - x) / w + (py - y) / h) / 2, r = step * 0.42 * t;
      if (r > 0.6) { ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  // The milestone number. Filled behind a cutout player, outlined over a normal photo.
  function giant(k, g, text, base, behind) {
    const ctx = k.ctx, t = String(text); if (!t) return;
    const s = k.fit(t, g.W * 0.96, 820, k.D, "", 100);
    ctx.font = k.font(s, k.D); ctx.textAlign = "center";
    if (behind) { ctx.fillStyle = g.photo ? g.accent : k.hexA(g.accent, 0.16); ctx.fillText(t, g.W / 2, base); }
    else { ctx.lineWidth = 5; ctx.strokeStyle = k.hexA(g.accent, 0.85); ctx.strokeText(t, g.W / 2, base); }
    ctx.textAlign = "left";
  }

  // Three stumps with the middle one knocked back and the bails flying.
  function stumps(k, cx, base, h, color) {
    const ctx = k.ctx, sw = h * 0.075, gap = h * 0.2;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 18;
    [[-1, -0.06], [0, -0.34], [1, 0.14]].forEach(([i, a]) => {
      ctx.save(); ctx.translate(cx + i * gap, base); ctx.rotate(a);
      const gr = ctx.createLinearGradient(-sw / 2, 0, sw / 2, 0); gr.addColorStop(0, "#FFF6E0"); gr.addColorStop(1, "#C9B48A");
      ctx.fillStyle = gr; k.roundRect(-sw / 2, -h, sw, h, sw / 2); ctx.fill(); ctx.restore();
    });
    ctx.fillStyle = color;
    [[-gap * 0.9, -h - 60, -0.8], [gap * 0.8, -h - 120, 0.5]].forEach(([dx, dy, a]) => {
      ctx.save(); ctx.translate(cx + dx, base + dy); ctx.rotate(a); k.roundRect(-gap * 0.55, -sw * 0.32, gap * 1.1, sw * 0.64, sw * 0.32); ctx.fill(); ctx.restore();
    });
    ctx.shadowBlur = 0; ctx.strokeStyle = k.hexA(color, 0.8); ctx.lineWidth = 5; ctx.lineCap = "round";
    [[-gap * 1.6, -h - 10, -gap * 2.3, -h - 40], [-gap * 1.5, -h - 60, -gap * 2.4, -h - 75], [gap * 1.6, -h - 90, gap * 2.4, -h - 130], [gap * 1.8, -h - 40, gap * 2.6, -h - 60]]
      .forEach(([a, b, c, d]) => { ctx.beginPath(); ctx.moveTo(cx + a, base + b); ctx.lineTo(cx + c, base + d); ctx.stroke(); });
    ctx.restore();
  }

  // Small value + label column, right-aligned at x.
  function statCol(k, g, value, label, x, base) {
    const ctx = k.ctx; ctx.textAlign = "right";
    ctx.font = k.font(68, k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(value), x, base - 34);
    ctx.font = k.font(26, k.C, 700); k.spaced(3); ctx.fillStyle = g.accent; ctx.fillText(cap(label), x, base); k.spaced(0);
    ctx.textAlign = "left";
  }

  const fadeFor = (g, textTop) => [Math.max(g.st + 120, textTop - 320), textTop + 60];
  const vs = (g) => [g.val("team"), g.val("opp")].filter(Boolean).join(" vs ");

  // ---------- Fifty / Century ----------
  L.batting = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, runs = num(g.val("runs")), balls = num(g.val("balls")), fours = num(g.val("fours")), sixes = num(g.val("sixes"));
      const ton = Number(g.t.milestone) >= 100, sr = balls ? ((runs / balls) * 100).toFixed(1) : "-";
      const barY = g.footerY - 88, scoreBase = barY - 68, nameBase = scoreBase - 136;
      const nameTop = playerName(k, g, g.val("player"), nameBase, 150, false), ribH = 100, ribTop = nameTop - 34 - ribH;
      const behind = !g.photo || g.photo.cut, [f0, f1] = fadeFor(g, ribTop);

      if (ton) rays(k, g.W / 2, ribTop - 260, g.W * 1.2, 32, g.accent, 0.09);
      if (behind) giant(k, g, g.t.milestone, ribTop + 50, true);
      photo(k, g, f0, f1);
      if (!behind) giant(k, g, g.t.milestone, ribTop + 50, false);
      halftone(k, g.W * 0.45, ribTop, g.W * 0.55, g.footerY - ribTop, g.accent, 0.1);

      ctx.font = k.font(130, k.D); ctx.fillStyle = g.accent; ctx.fillText(r, PAD - 4, scoreBase);
      const rw = ctx.measureText(r).width;
      ctx.font = k.font(60, k.C, 700); ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillText(`(${balls})`, PAD + rw + 10, scoreBase);
      statCol(k, g, sr, "Strike rate", g.W - PAD, scoreBase);
      statCol(k, g, sixes, "Sixes", g.W - PAD - 200, scoreBase);
      statCol(k, g, fours, "Fours", g.W - PAD - 330, scoreBase);

  };

  // ---------- Knock (X off Y) ----------

      k.header(g);

      ctx.font = k.font(figSize, k.D); ctx.fillStyle = duck ? "#FFFFFF" : g.accent; ctx.fillText(r, PAD - 6, figBase);
      const x = PAD + ctx.measureText(r).width + 34;
      ctx.font = k.font(46, k.C, 700); k.spaced(6); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillText("OFF", x, figBase - 136); k.spaced(0);
      ctx.font = k.font(150, k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(balls), x - 4, figBase);
      const bw = ctx.measureText(String(balls)).width;
      ctx.font = k.font(40, k.C, 700); k.spaced(4); ctx.fillText("BALLS", x + bw + 14, figBase); k.spaced(0);

  // ---------- Wicket ----------
  L.wicket = {
    standard: false,
    draw(k, g) {

  // ---------- Five-wicket haul ----------
  L.bowling = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, w = num(g.val("wkts")), r = num(g.val("runs")), b = k.oversToBalls(g.val("overs"));
      const chipTop = g.footerY - 60 - 58, figBase = chipTop - 40, figSize = 250, nameBase = figBase - figSize * 0.76 - 46;
      const nameTop = playerName(k, g, g.val("player"), nameBase, 140, false), ribH = 96, ribTop = nameTop - 34 - ribH;
      const behind = !g.photo || g.photo.cut, [f0, f1] = fadeFor(g, ribTop);

      if (behind) giant(k, g, w, ribTop + 50, true);
      photo(k, g, f0, f1);
      halftone(k, g.W * 0.45, ribTop, g.W * 0.55, g.footerY - ribTop, g.accent, 0.1);

      ribbon(k, g, g.big, ribTop, ribH, vs(g));
      playerName(k, g, g.val("player"), nameBase, 140);
      ctx.font = k.font(figSize, k.D); ctx.fillStyle = g.accent; ctx.fillText(String(w), PAD - 6, figBase);
      let x = PAD - 6 + ctx.measureText(String(w)).width;
      ctx.fillStyle = "#FFFFFF"; ctx.fillText("/" + r, x, figBase); x += ctx.measureText("/" + r).width + 40;
      const n = Math.min(w, 10), rows = n > 5 ? 2 : 1, br = rows > 1 ? 30 : 40, step = br * 2 + 14;
      for (let i = 0; i < n; i++) {
        const row = rows > 1 ? Math.floor(i / 5) : 0, col = rows > 1 ? i % 5 : i;
        if (x + col * step + br * 2 > g.W - PAD) continue;
        ball(k, x + br + col * step, figBase - figSize * 0.38 + (rows > 1 ? (row - 0.5) * (br * 2 + 14) : 0), br);
      }
      x = PAD;
      x += chip(k, g, `${g.val("overs")} overs`, x, chipTop, true) + 14;
      x += chip(k, g, `Economy ${b ? (r / (b / 6)).toFixed(2) : "-"}`, x, chipTop) + 14;
      k.footer(g);
    },
  };

  // ---------- Brilliant over / Bad over ----------
  L.over = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, o = k.parseOver(g.val("balls")), n = Math.max(o.balls.length, 6), gap = 14;
      const d = Math.min(150, (g.W - 2 * PAD - gap * (n - 1)) / n), cumBase = g.footerY - 62, cy = cumBase - 48 - d / 2;
      const figBase = cy - d / 2 - 54, figSize = 250, nameBase = figBase - figSize * 0.76 - 46;
      const nameTop = playerName(k, g, g.val("player"), nameBase, 130, false), ribH = 96, ribTop = nameTop - 34 - ribH;
      const [f0, f1] = fadeFor(g, ribTop);

      photo(k, g, f0, f1);
      const glow = ctx.createRadialGradient(g.W / 2, g.H, 0, g.W / 2, g.H, g.H * 0.6);
      glow.addColorStop(0, k.hexA(g.accent, 0.28)); glow.addColorStop(1, k.hexA(g.accent, 0));
      ctx.fillStyle = glow; ctx.fillRect(0, 0, g.W, g.H);
      k.header(g);

      ribbon(k, g, g.big, ribTop, ribH, `Over ${g.val("over")} · vs ${g.val("opp")}`);
      playerName(k, g, g.val("player"), nameBase, 130);
      const wkFirst = o.wk >= 1 && o.runs < 8, main = String(wkFirst ? o.wk : o.runs);
      ctx.font = k.font(figSize, k.D); ctx.fillStyle = g.accent; ctx.fillText(main, PAD - 6, figBase);
      const x = PAD + ctx.measureText(main).width + 30;
      ctx.font = k.font(84, k.D); ctx.fillStyle = "#FFFFFF";
      ctx.fillText(wkFirst ? (o.wk > 1 ? "WICKETS" : "WICKET") : (o.runs === 1 ? "RUN" : "RUNS"), x, figBase - 104);
      ctx.font = k.font(38, k.C, 700); k.spaced(3); ctx.fillStyle = "rgba(255,255,255,0.82)";
      const second = wkFirst ? `${o.runs} run${o.runs === 1 ? "" : "s"} given` : o.wk ? `and ${o.wk} wicket${o.wk > 1 ? "s" : ""}` : "in one over";
      ctx.fillText(cap(second), x, figBase - 40, g.W - PAD - x); k.spaced(0);

      let total = 0;
      o.balls.forEach((bl, i) => {
        const t = bl.toUpperCase(), cx = PAD + d / 2 + i * (d + gap);
        const v = t === "W" ? 0 : /^(WD|NB)/.test(t) ? 1 + (parseInt(t.slice(2)) || 0) : parseInt(t) || 0;
        total += v;
        const hot = t === "W" || t === "6" || t === "4";
        ball(k, cx, cy, d / 2 - 4, { white: true, alpha: t === "0" ? 0.45 : 1, label: t === "0" ? "•" : t, ring: hot ? g.accent : null });
        ctx.textAlign = "center"; ctx.font = k.font(28, k.C, 700); k.spaced(2);
        ctx.fillStyle = t === "W" ? g.accent : "rgba(255,255,255,0.7)"; ctx.fillText(t === "W" ? "OUT" : String(total), cx, cumBase - 2); k.spaced(0);
        ctx.textAlign = "left";
      });
      k.footer(g);
    },
  };

  // ---------- Score update (TV score bar) ----------
  L.scoreupd = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, detail = g.val("detail"), barH = 190, barBottom = detail ? g.footerY - 128 : g.footerY - 64, barTop = barBottom - barH;
      const chipTop = barTop - 34 - 58, [f0, f1] = fadeFor(g, chipTop - 20);

      k.header(g);

      const st = cap(g.val("status")), live = /LIVE/.test(st);
      ctx.font = k.font(32, k.C, 700); k.spaced(3);
      const cw = ctx.measureText(st).width + 44 + (live ? 34 : 0); k.spaced(0);
      ctx.fillStyle = g.accent; k.roundRect(PAD, chipTop, cw, 58, 29); ctx.fill();
      if (live) { ctx.beginPath(); ctx.arc(PAD + 30, chipTop + 29, 10, 0, Math.PI * 2); ctx.fillStyle = "#E3262F"; ctx.fill(); }
      ctx.font = k.font(32, k.C, 700); k.spaced(3); ctx.fillStyle = k.inkOn(g.accent); ctx.fillText(st, PAD + 22 + (live ? 34 : 0), chipTop + 40); k.spaced(0);

      const bw = 260;
      ctx.fillStyle = "rgba(8,10,16,0.88)"; ctx.fillRect(PAD, barTop, g.W - 2 * PAD, barH);
      ctx.fillStyle = g.accent; ctx.beginPath(); ctx.moveTo(PAD, barTop); ctx.lineTo(PAD + bw + 40, barTop); ctx.lineTo(PAD + bw, barBottom); ctx.lineTo(PAD, barBottom); ctx.closePath(); ctx.fill();
      const ab = cap(g.val("abbr")), ink = k.inkOn(g.accent);
      ctx.textAlign = "center"; ctx.font = k.font(k.fit(ab, bw - 50, 110, k.D), k.D); ctx.fillStyle = ink; ctx.fillText(ab, PAD + bw / 2, barTop + 122);
      ctx.font = k.font(26, k.C, 700); k.spaced(3); ctx.fillText(cap(g.val("team")), PAD + bw / 2, barTop + 166, bw - 40); k.spaced(0);
      ctx.textAlign = "left";
      const sc = String(g.val("score")), runs = num(sc.split("/")[0]), b = k.oversToBalls(g.val("overs"));
      ctx.font = k.font(k.fit(sc, g.W - PAD - 370 - (PAD + bw + 60), 150, k.D), k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(sc, PAD + bw + 60, barTop + 150);
      statCol(k, g, b ? (runs / (b / 6)).toFixed(2) : "-", "Run rate", g.W - PAD - 30, barTop + 150);
      statCol(k, g, g.val("overs"), "Overs", g.W - PAD - 200, barTop + 150);
      if (detail) { ctx.font = k.font(42, k.C, 600); ctx.fillStyle = "rgba(255,255,255,0.88)"; ctx.fillText(detail, PAD, g.footerY - 66, g.W - 2 * PAD); }

  };

  // ---------- Innings break ----------
  L.innings = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, score = String(g.val("score")), target = num(score.split("/")[0]) + 1;
      const overs = parseFloat(g.val("overs")) || 0, balls = k.oversToBalls(g.val("overs"));

      const teamBase = tBase - tSize * 0.76 - 40, ribH = 90, ribTop = teamBase - 72 - 34 - ribH;

      const x = PAD + ctx.measureText(String(target)).width + 34;
      ctx.font = k.font(90, k.D); ctx.fillStyle = g.accent; ctx.fillText("TARGET", x, tBase - 128);
      ctx.font = k.font(38, k.C, 700); k.spaced(3); ctx.fillStyle = "rgba(255,255,255,0.85)";

  // ---------- Match result ----------
  L.result = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, potTop = g.footerY - 56 - 64, rowH = 112, row2Top = potTop - 40 - rowH, row1Top = row2Top - 14 - rowH;
      const hd = cap(g.val("headline"));

      halftone(k, g.W * 0.45, hTop, g.W * 0.55, g.footerY - hTop, g.accent, 0.1);

      [[g.val("t1"), g.val("s1"), true], [g.val("t2"), g.val("s2"), false]].forEach(([tm, sc, won], i) => {
        const y = i ? row2Top : row1Top, sl = 26, ink = won ? k.inkOn(g.accent) : "rgba(255,255,255,0.72)";
        ctx.fillStyle = won ? g.accent : "rgba(255,255,255,0.08)";
        ctx.beginPath(); ctx.moveTo(PAD + sl, y); ctx.lineTo(g.W - PAD, y); ctx.lineTo(g.W - PAD - sl, y + rowH); ctx.lineTo(PAD, y + rowH); ctx.closePath(); ctx.fill();

        ctx.textAlign = "right"; ctx.font = k.font(k.fit(String(sc), g.W * 0.36, 70, k.D), k.D); ctx.fillStyle = ink; ctx.fillText(String(sc), g.W - PAD - 50, y + 84); ctx.textAlign = "left";

  // ---------- Recent form (bar chart) ----------
  L.form = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx;
      const items = String(g.val("scores")).split(",").map((x) => x.trim()).filter(Boolean).slice(0, 15)
        .map((x) => { const m = x.split(/\s+/); return { s: m[0], o: cap(m[1] || ""), r: num(m[0]), no: m[0].includes("*") }; }).reverse();
      const base = g.footerY - 104, chartH = g.H > 1500 ? 470 : 330, n = Math.max(items.length, 1);
      const max = Math.max(100, ...items.map((i) => i.r)), cw = (g.W - 2 * PAD) / n, bw = Math.min(70, cw * 0.62);
      const statBase = base - chartH - 70, nameBase = statBase - 84;
      const nameTop = playerName(k, g, g.val("player"), nameBase, 130, false), ribH = 84, ribTop = nameTop - 30 - ribH;

      k.header(g);

      ribbon(k, g, g.val("title"), ribTop, ribH);
      playerName(k, g, g.val("player"), nameBase, 130);
      const outs = items.filter((i) => !i.no).length, total = items.reduce((a, i) => a + i.r, 0);
      const hs = items.reduce((a, i) => (i.r > a.r || (i.r === a.r && i.no) ? i : a), { r: -1, s: "-" });
      let x = PAD;
      [["Average", outs ? (total / outs).toFixed(1) : "-"], ["50s", items.filter((i) => i.r >= 50).length], ["Best", hs.s]].forEach(([lab, v]) => {
        ctx.font = k.font(64, k.D); ctx.fillStyle = "#FFFFFF"; ctx.fillText(String(v), x, statBase);
        const vw = ctx.measureText(String(v)).width;
        ctx.font = k.font(26, k.C, 700); k.spaced(3); ctx.fillStyle = g.accent; ctx.fillText(cap(lab), x + vw + 12, statBase); x += vw + ctx.measureText(cap(lab)).width + 60; k.spaced(0);
      });
      ctx.font = k.font(24, k.C, 700); k.spaced(3); ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.textAlign = "right";
      ctx.fillText("OLDEST  →  NEWEST", g.W - PAD, statBase); ctx.textAlign = "left"; k.spaced(0);

      const y50 = base - (chartH - 50) * (50 / max);
      ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = k.hexA(g.accent, 0.7); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(PAD, y50); ctx.lineTo(g.W - PAD, y50); ctx.stroke(); ctx.restore();
      items.forEach((it, i) => {
        const cx = PAD + cw * i + cw / 2, h = Math.max(6, (chartH - 50) * (it.r / max)), good = it.r >= 50;
        ctx.fillStyle = good ? g.accent : "rgba(255,255,255,0.75)"; k.roundRect(cx - bw / 2, base - h, bw, h, Math.min(10, bw / 2)); ctx.fill();
        ctx.textAlign = "center";
        ctx.font = k.font(k.fit(it.s, cw - 6, 46, k.D, "", 20), k.D); ctx.fillStyle = good ? g.accent : "#FFFFFF"; ctx.fillText(it.s, cx, base - h - 12);
        ctx.font = k.font(k.fit(it.o, cw - 6, 26, k.C, 700, 14), k.C, 700); ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillText(it.o, cx, base + 36);
        ctx.textAlign = "left";
      });
      k.footer(g);
    },
  };

  // ---------- Toss ----------
  L.toss = {
    standard: false,
    draw(k, g) {
      const ctx = k.ctx, detail = g.val("detail"), txt = cap(g.val("stamp"));
      const lay = k.layoutRich(txt, g.W - 2 * PAD, 150, k.D, 3, 60), lh = lay.size * 0.95;
      const hBase = (detail ? g.footerY - 120 : g.footerY - 66) - (lay.lines.length - 1) * lh;
      const hTop = hBase - lay.size * 0.76, labBase = hTop - 30;
      const [f0, f1] = fadeFor(g, labBase - 40);
      photo(k, g, f0, f1);
      k.header(g);

      const r = 150, cx = g.W - PAD - r, cy = labBase - 60 - r;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.25); ctx.scale(1, 0.9);
      ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(0, 18, r, 0, Math.PI * 2); ctx.fillStyle = "#8A6416"; ctx.fill(); ctx.shadowBlur = 0;
      const gr = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 10, 0, 0, r);
      gr.addColorStop(0, "#FFF0B8"); gr.addColorStop(0.6, "#E8B947"); gr.addColorStop(1, "#B9862A");
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r - 18, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(110,72,8,0.55)"; ctx.stroke();
      ctx.fillStyle = "rgba(110,72,8,0.55)";
      for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2; ctx.beginPath(); ctx.arc(Math.cos(a) * (r - 34), Math.sin(a) * (r - 34), 4, 0, Math.PI * 2); ctx.fill(); }
      ctx.textAlign = "center"; ctx.font = k.font(84, k.D); ctx.fillStyle = "#6B4A0E"; ctx.fillText("TOSS", 0, 30);
      ctx.restore();

      if (g.val("player")) { ctx.font = k.font(40, k.C, 700); k.spaced(6); ctx.fillStyle = g.accent; ctx.fillText(cap(g.val("player")), PAD, labBase, g.W - 2 * PAD); k.spaced(0); }
      k.drawRich(lay, PAD - 4, hBase, lh, k.D, "#FFFFFF", g.accent, "left");
      if (detail) { ctx.font = k.font(42, k.C, 600); ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillText(cap(detail), PAD, g.footerY - 66, g.W - 2 * PAD); }
      k.footer(g);
    },
  };
})();

</script>
<script>
// The form, the live preview and the download/share buttons.
window.BPG = window.BPG || {};

(() => {
  const $ = (id) => document.getElementById(id);
  const T = BPG.TEMPLATES, L = BPG.LAYOUTS, THEMES = BPG.THEMES, PLATFORMS = BPG.PLATFORMS;
  const cv = $("poster"), ctx = cv.getContext("2d");

  const firstOf = (cat) => Object.keys(T).find((k) => T[k].cat === cat);
  const state = {
    cat: Object.keys(BPG.CATS)[0], tpl: firstOf(Object.keys(BPG.CATS)[0]), platform: "instagram",
    values: {}, kicker: "BAN vs SA · 1st ODI", verdict: "", theme: "brand", brand: { ...BPG.BRAND },
  };
  const photos = { 1: null, 2: null };
  let logoImg = null;

  try {
    const saved = JSON.parse(localStorage.getItem("bpg_state") || "null");
    if (saved) Object.assign(state, saved, { brand: { ...BPG.BRAND, ...(saved.brand || {}) } });
  } catch (e) {}
  if (!T[state.tpl]) { state.cat = Object.keys(BPG.CATS)[0]; state.tpl = firstOf(state.cat); }
  if (!BPG.CATS[state.cat]) state.cat = T[state.tpl].cat;
  const persist = () => { try { localStorage.setItem("bpg_state", JSON.stringify(state)); } catch (e) {} };

  BPG.state = () => state;
  BPG.logoImage = () => logoImg;
  const adjust = () => ({ zoom: parseFloat($("zoom").value), offx: parseFloat($("offx").value), offy: parseFloat($("offy").value), shade: parseFloat($("shade").value) });
  const k = BPG.createKit(ctx, { state: () => state, logo: () => logoImg, adjust });

  const val = (id) => {
    const v = state.values[state.tpl] && state.values[state.tpl][id];
    if (v !== undefined) return v;
    const f = T[state.tpl].fields.find((x) => x[0] === id);
    return f ? f[2] : "";
  };

  // ---------- Form ----------
  function button(parent, label, pressed, onClick) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(pressed)); b.onclick = onClick;
    parent.appendChild(b);
  }
  function renderCats() {
    $("cats").innerHTML = "";
    Object.entries(BPG.CATS).forEach(([key, label]) => button($("cats"), label, state.cat === key, () => {
      state.cat = key; state.tpl = firstOf(key); persist(); renderAll();
    }));
  }
  function renderTypes() {
    $("types").innerHTML = "";
    Object.entries(T).filter(([, t]) => t.cat === state.cat).forEach(([key, t]) => button($("types"), t.name, state.tpl === key, () => {
      state.tpl = key; persist(); renderAll();
    }));
  }
  function addField(parent, id, label, value, wide, type, onInput) {
    const d = document.createElement("div");
    d.className = "field" + (wide ? " wide" : "");
    const l = document.createElement("label"); l.htmlFor = id; l.textContent = label;
    const i = document.createElement(type === "area" ? "textarea" : "input");
    if (type !== "area") i.type = "text";
    i.id = id; i.value = value;
    i.addEventListener("input", () => onInput(i.value));
    d.append(l, i); parent.appendChild(d);
  }
  function setVal(id, v) { (state.values[state.tpl] = state.values[state.tpl] || {})[id] = v; persist(); draw(); }
  function renderFields() {
    const box = $("fields"), t = T[state.tpl]; box.innerHTML = "";
    addField(box, "f_kicker", "Match / tag line (top left pill)", state.kicker, true, "text", (v) => { state.kicker = v; persist(); draw(); });
    addField(box, "f_verdict", "Your verdict (optional, shows at the bottom)", state.verdict || "", true, "text", (v) => { state.verdict = v; persist(); draw(); });
    if (t.big) addField(box, "f_big", "Big headline word", val("__big") || t.big, false, "text", (v) => setVal("__big", v));
    t.fields.forEach(([id, label, , wide, type]) => addField(box, `f_${state.tpl}_${id}`, label, val(id), wide, type, (v) => setVal(id, v)));
    $("photo2Wrap").hidden = !t.photo2;
    $("photo2Label").textContent = t.photo2 || "Second photo";
    $("tplHint").textContent = t.hint || "";
    $("tplHint").hidden = !t.hint;
  }
  function renderPlatforms() {
    $("platforms").innerHTML = "";
    Object.entries(PLATFORMS).forEach(([key, p]) => button($("platforms"), p.label, state.platform === key, () => {
      state.platform = key; persist(); renderPlatforms(); draw();
    }));
  }
  function renderBrand() {
    $("b_handle").value = state.brand.handle; $("b_name").value = state.brand.name;
    $("b_accent").value = state.brand.accent; $("b_bg").value = state.brand.bg;
    const sel = $("b_theme"); sel.innerHTML = "";
    Object.entries(THEMES).forEach(([key, th]) => { const o = document.createElement("option"); o.value = key; o.textContent = th.label; sel.appendChild(o); });
    sel.value = THEMES[state.theme] ? state.theme : "brand";
  }
  function renderAll() { renderCats(); renderTypes(); renderFields(); draw(); }

  $("b_theme").addEventListener("change", (e) => { state.theme = e.target.value; persist(); draw(); });
  ["b_handle", "b_name", "b_accent", "b_bg"].forEach((id) => $(id).addEventListener("input", (e) => {
    state.brand[{ b_handle: "handle", b_name: "name", b_accent: "accent", b_bg: "bg" }[id]] = e.target.value; persist(); draw();
  }));
  ["zoom", "offx", "offy", "shade"].forEach((id) => $(id).addEventListener("input", draw));
  $("resetPhoto").addEventListener("click", () => { $("zoom").value = 1; $("offx").value = 0; $("offy").value = 0; $("shade").value = 0.15; draw(); });

  // ---------- Photos ----------
  function loadImage(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = r.result; };
      r.onerror = rej; r.readAsDataURL(file);
    });
  }
  // A PNG with see-through corners counts as a cutout (the big number then goes behind the player).
  function isCutout(img) {
    try {
      const c = document.createElement("canvas"); c.width = 24; c.height = 24;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data;
      return [0, 23, 24 * 23, 24 * 24 - 1, 12, 24 * 12].filter((p) => d[p * 4 + 3] < 200).length >= 2;
    } catch (e) { return false; }
  }
  [1, 2].forEach((n) => $("photo" + n).addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = await loadImage(f); photos[n] = { img, cut: isCutout(img) }; draw();
  }));
  $("b_logo").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = await loadImage(f);
    const c = document.createElement("canvas"), s = Math.min(1, 240 / Math.max(img.width, img.height));
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    state.brand.logo = c.toDataURL("image/png"); persist(); setLogo();
  });
  $("b_clearLogo").addEventListener("click", () => { state.brand.logo = null; logoImg = null; persist(); draw(); });
  function setLogo() {
    if (!state.brand.logo) { logoImg = null; draw(); return; }
    const i = new Image(); i.onload = () => { logoImg = i; draw(); }; i.src = state.brand.logo;
  }

  // ---------- Drawing ----------
  function draw() {
    const p = PLATFORMS[state.platform], t = T[state.tpl], layout = L[t.layout];
    if (!layout) { console.error(`Layout "${t.layout}" not found in layouts.js`); return; }
    if (cv.width !== p.w || cv.height !== p.h) { cv.width = p.w; cv.height = p.h; }
    const th = THEMES[state.theme] || THEMES.brand, look = state.theme === "brand" ? t.look || {} : {};
    const footerY = p.bottom - 4, statsTop = footerY - 166, subBase = statsTop - 30, nameBase = subBase - 56, bigBase = nameBase - 112;
    const g = {
      W: p.w, H: p.h, st: p.top, sb: p.bottom, footerY, statsTop, subBase, nameBase, bigBase, blockTop: bigBase - 170,
      accent: t.accent || look.accent || th.accent || state.brand.accent,
      bg: look.bg || th.bg || state.brand.bg,
      t, val, big: val("__big") || t.big || "", photo: photos[1], photos, shade: adjust().shade, ctx,
    };

    ctx.clearRect(0, 0, g.W, g.H);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; k.spaced(0);
    k.background(g);
    if (!layout.standard) { layout.draw(k, g); return; }

    const giant = layout.giant && layout.giant(g);
    if (giant && (!g.photo || g.photo.cut)) {
      ctx.font = k.font(k.fit(String(giant), g.W * 0.96, t.layout === "rating" ? 520 : 760, k.D), k.D); ctx.textAlign = "center";
      ctx.fillStyle = k.hexA(g.accent, g.photo ? 0.92 : 0.16);
      ctx.fillText(String(giant), g.W / 2, g.blockTop + 120); ctx.textAlign = "left";
    }
    if (!k.photoArea(g, g.H)) k.photoHint(g, g.st + (g.blockTop - g.st) / 2 + 60);
    if (g.photo) k.scrim(g, g.blockTop - 240, g.blockTop + 220);
    if (g.photo) k.slash(g, g.blockTop - 40);
    k.header(g);
    // A soft shadow keeps the text readable on top of the photo.
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 18;
    layout.draw(k, g);
    ctx.restore();
    k.footer(g);
  }
  BPG.draw = draw;

  // ---------- Export ----------
  const status = (m) => { $("status").textContent = m; };
  const filename = () => `borhan-${state.tpl}-${state.platform}-${new Date().toISOString().slice(0, 10)}.png`;
  const toBlob = () => new Promise((res) => { draw(); cv.toBlob(res, "image/png"); });
  let claudeDownloads = null;
  if (window.claude && window.claude.use) window.claude.use("downloads").then((d) => { claudeDownloads = d; }).catch(() => {});

  $("download").addEventListener("click", async () => {
    const blob = await toBlob();
    if (!blob) { status("Couldn't create the image. Try a smaller photo."); return; }
    if (claudeDownloads) {
      try { await claudeDownloads.save({ filename: filename(), data: blob }); status("Saved " + filename()); return; }
      catch (e) { if (e && e.code === "declined") { status("Download cancelled."); return; } }
    }
    try {
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      status("Downloaded " + filename());
    } catch (e) { showImage(); status("Long-press or right-click the image below to save it."); }
  });

  // On phones this opens the share sheet, so you can post straight to Instagram, TikTok or Facebook.
  $("share").addEventListener("click", async () => {
    const blob = await toBlob();
    const file = new File([blob], filename(), { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); status("Shared."); }
      catch (e) { if (e.name !== "AbortError") { showImage(); status("Sharing isn't available here. Long-press the image below to save it."); } }
    } else { showImage(); status("Sharing isn't available in this browser. Long-press or right-click the image below to save it."); }
  });
  function showImage() { draw(); $("saveImg").src = cv.toDataURL("image/png"); $("saveImg").hidden = false; }
  $("showImg").addEventListener("click", () => { showImage(); status("Long-press (phone) or right-click (computer) the image to save it."); });

  // ---------- Start ----------
  renderBrand(); renderPlatforms(); renderAll(); setLogo();
  const fonts = document.fonts && document.fonts.load
    ? Promise.all(["100px Anton", "700 40px 'Barlow Condensed'", "italic 700 40px 'Barlow Condensed'", "600 40px 'Barlow Condensed'", "400 40px Barlow", "500 40px Barlow", "700 40px 'Hind Siliguri'"].map((f) => document.fonts.load(f)))
    : Promise.resolve();
  fonts.then(draw, draw);
})();

</script>
